<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Plan de Melisson</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; gap:6px; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
    transition:all .15s ease;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }
  .navLinks a.active{ background:var(--cyan); color:var(--bg); }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:50px 28px 100px;
  }

  .pageHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:40px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .backLink{
    font-size:13px;
    font-weight:600;
    color:var(--cyan);
    text-decoration:none;
  }

  .weekHead{
    margin:44px 0 8px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }

  .weekHead:first-child{ margin-top:0; }

  .weekTitle{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:18px;
    color:var(--yellow);
  }

  .weekMeta{
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
  }

  .dayLabel{
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--pink);
    margin:26px 0 12px;
  }

  .cardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:12px;
  }

  .exCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:14px;
    padding:16px 18px;
  }

  .exTag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .exName{
    font-size:14.5px;
    font-weight:600;
    color:#fff;
    margin-bottom:14px;
    line-height:1.35;
  }

  .exStats{
    display:flex;
    gap:16px;
  }

  .exStats span{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:18px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }

  .exStats small{
    font-family:'Inter',sans-serif;
    font-size:9.5px;
    font-weight:600;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.5px;
  }

  .empty{
    color:var(--muted);
    font-size:14px;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <h1 id="tituloAtleta">Cargando...</h1>
    <a href="dashboard.html" class="backLink">&larr; Volver al Dashboard</a>
  </div>

  <div id="planContenedor">
    <p class="empty">Cargando plan...</p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="assets/plan.js"></script>
<script>
  renderPlan("Melisson");
</script>

</body>
</html>
