<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Recursos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; gap:6px; flex-wrap:wrap; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }
  .navLinks a.active{ background:var(--cyan); color:var(--bg); }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:50px 24px 100px;
  }

  .pageHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:.5px;
    margin:0 0 10px;
    color:#fff;
  }

  .pageHead p{
    color:var(--muted);
    font-size:14px;
    max-width:520px;
    margin:0 0 34px;
    line-height:1.5;
  }

  .recursoCard{
    display:block;
    text-decoration:none;
    color:inherit;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
    transition:transform .15s ease, border-color .15s ease;
  }

  .recursoCard:hover{
    transform:translateY(-3px);
    border-color:var(--cyan);
  }

  .recursoCard .fecha{
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }

  .recursoCard h2{
    font-size:17px;
    margin:0 0 8px;
    color:#fff;
  }

  .recursoCard p{
    font-size:13.5px;
    color:var(--muted);
    margin:0;
    line-height:1.55;
  }

  .empty{
    color:var(--muted);
    font-size:14px;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:40px 0 20px;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="index.html">Home</a>
    <a href="ranking.html">Ranking</a>
    <a href="records.html">Records</a>
    <a href="calculadora.html">Calculadora</a>
    <a href="recursos.html" class="active">Recursos</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <div class="eyebrow">Conocimiento del entrenamiento</div>
    <h1>Recursos</h1>
    <p>Artículos y hallazgos relevantes para atletas y entrenadores de halterofilia.</p>
  </div>

  <div id="recursosLista">
    <p class="empty">Cargando...</p>
  </div>

</div>

<footer>Lift Club &middot; Recursos actualizados periódicamente</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>

  Papa.parse("recursos.csv?v=" + Date.now(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      const lista = document.getElementById("recursosLista");
      if (!results.data || results.data.length === 0) {
        lista.innerHTML = `<p class="empty">Información en construcción.</p>`;
        return;
      }
      lista.innerHTML = results.data.map(r => `
        <a href="${r["Archivo"]}" class="recursoCard">
          <div class="fecha">${r["Fecha"]}</div>
          <h2>${r["Titulo"]}</h2>
          <p>${r["Resumen"]}</p>
        </a>
      `).join("");
    },
    error: function () {
      document.getElementById("recursosLista").innerHTML =
        `<p class="empty">Información en construcción.</p>`;
    }
  });

</script>

</body>
</html>
