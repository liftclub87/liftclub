<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }
  .navLinks a.active{ background:var(--cyan); color:var(--bg); }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:60px 24px 100px;
  }

  .pageHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:.5px;
    margin:0 0 10px;
    color:#fff;
  }

  /* ---- Vista de login ---- */

  .loginBtns{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:340px;
    margin-top:30px;
  }

  a.loginBtn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.3px;
    padding:16px 24px;
    border-radius:12px;
    transition:transform .15s ease;
  }

  a.loginBtn:hover{ transform:translateY(-2px); }

  a.loginBtn.microsoft{
    background:#fff;
    color:#1a1a1a;
  }

  a.loginBtn.google{
    background:var(--paper);
    color:#fff;
    border:1px solid var(--line);
  }

  /* ---- Vista personalizada de atleta ---- */

  .miPanel{
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:420px;
    margin-top:30px;
  }

  a.accionBtn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    color:#fff;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:14px;
    padding:22px 24px;
    font-size:16px;
    font-weight:600;
    transition:transform .15s ease, border-color .15s ease;
  }

  a.accionBtn:nth-child(2){ border-left-color:var(--pink); }
  a.accionBtn:nth-child(3){ border-left-color:var(--yellow); }

  a.accionBtn:hover{
    transform:translateY(-3px);
    border-color:var(--cyan);
  }

  .accionBtn .proximamente{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
  }

  div.accionBtn{
    opacity:.5;
    cursor:default;
  }

  div.accionBtn:hover{ transform:none; }

  /* ---- Vista admin (grids) ---- */

  .sectionHead{
    margin:56px 0 24px;
    padding-top:32px;
    border-top:1px solid var(--line);
  }

  .sectionHead:first-of-type{ border-top:none; padding-top:0; margin-top:30px; }

  .sectionHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .sectionHead h2{
    font-family:'Bungee', sans-serif;
    font-size:24px;
    font-weight:400;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:16px;
  }

  a.athlete{
    text-decoration:none;
    color:inherit;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:14px;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  a.athlete:hover{ border-color:var(--cyan); transform:translateY(-3px); }

  .initial{
    font-family:'Bungee', sans-serif;
    font-size:22px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#1f2124;
    color:var(--cyan);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .athlete h3{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:17px;
    margin:0;
    color:#fff;
  }

  .empty, .cargando{
    color:var(--muted);
    font-size:14px;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:40px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="index.html">Home</a>
    <a href="ranking.html">Ranking</a>
    <a href="records.html">Records</a>
    <a href="calculadora.html">Calculadora</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <div class="eyebrow">Portal</div>
    <h1 id="tituloPortal">Cargando...</h1>
  </div>

  <div id="contenido">
    <p class="cargando">Verificando tu sesión...</p>
  </div>

</div>

<script>

  // Mapa de roles a sus páginas de plan/monitoreo.
  // personalizado:true = plan individual (muestra el nombre); false = usa el plan general (muestra "Plan").
  const ATLETAS = {
    general:  { nombre: "Plan General", plan: "general.html", monitoreo: null,                 personalizado: false },
    dana:     { nombre: "Dana",     plan: "general.html", monitoreo: "Dana_monitoreo.html", personalizado: false },
    gian:     { nombre: "Gian",     plan: "general.html", monitoreo: null,                  personalizado: false },
    kevin:    { nombre: "Kevin",    plan: "general.html", monitoreo: null,                  personalizado: false },
    maroto:   { nombre: "Maroto",   plan: "general.html", monitoreo: null,                  personalizado: false },
    melina:   { nombre: "Melina",   plan: "general.html", monitoreo: null,                  personalizado: false },
    melisson: { nombre: "Melisson", plan: "Melisson.html", monitoreo: null,                 personalizado: true  },
    sebas:    { nombre: "Sebas",    plan: "general.html", monitoreo: null,                  personalizado: false },
    andres:   { nombre: "Andres",   plan: "general.html", monitoreo: null,                  personalizado: false },
    elena:    { nombre: "Elena",    plan: "general.html", monitoreo: null,                  personalizado: false },
  };

  function botonAccion(texto, href) {
    if (href) {
      return `<a href="${href}" class="accionBtn">${texto} <span>&rarr;</span></a>`;
    }
    return `<div class="accionBtn">${texto} <span class="proximamente">Próximamente</span></div>`;
  }

  function renderVistaAtleta(clave) {
    const a = ATLETAS[clave];
    const titulo = clave === "general" ? "Bienvenido" : `Hola, ${a.nombre}`;
    const textoPlan = a.personalizado ? "Ver mi plan de entrenamiento" : "Plan";
    document.getElementById("tituloPortal").textContent = titulo;
    document.getElementById("contenido").innerHTML = `
      <div class="miPanel">
        ${botonAccion(textoPlan, a.plan)}
        ${botonAccion("Ver mi monitoreo", a.monitoreo)}
        ${botonAccion("Calculadora de Carga e Intensidad", "carga-intensidad.html")}
      </div>
    `;
  }

  function renderVistaAdmin() {
    document.getElementById("tituloPortal").textContent = "Panel del coach";

    let html = `
      <div class="sectionHead">
        <div class="eyebrow">Planes</div>
        <h2>Atletas</h2>
      </div>
      <div class="grid">
    `;
    const planesMostrados = new Set();
    Object.entries(ATLETAS).forEach(([clave, a]) => {
      if (a.plan && !planesMostrados.has(a.plan)) {
        planesMostrados.add(a.plan);
        const etiqueta = a.personalizado ? a.nombre : "Plan";
        html += `
          <a href="${a.plan}" class="athlete">
            <div class="initial">${a.personalizado ? a.nombre.charAt(0) : "◇"}</div>
            <h3>${etiqueta}</h3>
          </a>
        `;
      }
    });
    html += `</div>`;

    html += `
      <div class="sectionHead">
        <div class="eyebrow">Monitoreo</div>
        <h2>Rendimiento y bienestar</h2>
      </div>
      <div class="grid">
    `;
    Object.entries(ATLETAS).forEach(([clave, a]) => {
      if (a.monitoreo) {
        html += `
          <a href="${a.monitoreo}" class="athlete">
            <div class="initial">${a.nombre.charAt(0)}</div>
            <h3>${a.nombre}</h3>
          </a>
        `;
      }
    });
    html += `</div>`;

    html += `
      <div class="sectionHead">
        <div class="eyebrow">Herramientas</div>
        <h2>Utilidades del club</h2>
      </div>
      <div class="grid">
        <a href="carga-intensidad.html" class="athlete">
          <div class="initial">◇</div>
          <h3>Carga e Intensidad</h3>
        </a>
      </div>
    `;

    document.getElementById("contenido").innerHTML = html;
  }

  function renderSinRol() {
    document.getElementById("tituloPortal").textContent = "Sin acceso asignado";
    document.getElementById("contenido").innerHTML =
      `<p class="empty">Tu cuenta inició sesión correctamente, pero todavía no tiene un rol asignado. Contacta al coach para que te agregue.</p>`;
  }

  function renderLogin() {
    document.getElementById("tituloPortal").textContent = "Ingresar";
    document.getElementById("contenido").innerHTML = `
      <p class="empty" style="margin-bottom:20px;">Elige con qué cuenta quieres iniciar sesión.</p>
      <div class="loginBtns">
        <a href="/.auth/login/aad?post_login_redirect_uri=/portal.html" class="loginBtn microsoft">Ingresar con Microsoft</a>
        <a href="/.auth/login/google?post_login_redirect_uri=/portal.html" class="loginBtn google">Ingresar con Google</a>
      </div>
    `;
  }

  fetch("/.auth/me")
    .then(r => r.json())
    .then(data => {
      const principal = data.clientPrincipal;
      if (!principal) {
        renderLogin();
        return;
      }
      const roles = principal.userRoles || [];

      if (roles.includes("admin")) {
        renderVistaAdmin();
        return;
      }

      const rolAtleta = Object.keys(ATLETAS).find(r => roles.includes(r));
      if (rolAtleta) {
        renderVistaAtleta(rolAtleta);
        return;
      }

      renderSinRol();
    })
    .catch(() => {
      document.getElementById("contenido").innerHTML =
        `<p class="empty">No se pudo verificar tu sesión. Intenta recargar la página.</p>`;
    });

</script>

</body>
</html>
