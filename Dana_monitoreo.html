<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Monitoreo de Dana</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; gap:6px; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }
  .navLinks a.active{ background:var(--cyan); color:var(--bg); }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:50px 28px 100px;
  }

  .pageHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:40px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:30px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .backLink{
    font-size:13px;
    font-weight:600;
    color:var(--cyan);
    text-decoration:none;
  }

  .chartCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
  }

  .chartCard h3{
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 16px;
  }

  .empty{
    color:var(--muted);
    font-size:14px;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <h1>Monitoreo &middot; Dana</h1>
    <a href="Dana.html" class="backLink">&larr; Ver plan de entrenamiento</a>
  </div>

  <div id="monitoreoContenedor">

    <div class="chartCard">
      <h3>Horas de sueño</h3>
      <canvas id="chartSueno"></canvas>
    </div>

    <div class="chartCard">
      <h3>RPE de la sesión</h3>
      <canvas id="chartRPE"></canvas>
    </div>

    <div class="chartCard">
      <h3>Repeticiones falladas</h3>
      <canvas id="chartFallos"></canvas>
    </div>

    <div class="chartCard" id="chartFaseWrap">
      <h3>Fase del periodo</h3>
      <canvas id="chartFase"></canvas>
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="assets/monitoreo.js"></script>
<script>
  renderMonitoreo("Dana");
</script>

</body>
</html>
