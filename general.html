<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Plan General</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; gap:6px; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }

  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:50px 24px 100px;
  }

  .pageHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:30px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:30px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .backLink{
    font-size:13px;
    font-weight:600;
    color:var(--cyan);
    text-decoration:none;
  }

  /* ---- Tarjeta de marcas personales ---- */

  .marcasCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--pink);
    border-radius:16px;
    padding:22px;
    margin-bottom:30px;
  }

  .marcasCard h2{
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--pink);
    margin:0 0 6px;
  }

  .marcasCard .sub{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 18px;
    line-height:1.5;
  }

  .marcasGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:14px;
    margin-bottom:16px;
  }

  .marcasGrid label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .marcasGrid input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:#fff;
    font-family:'Bungee', sans-serif;
    font-size:18px;
    padding:10px 12px;
    border-radius:8px;
  }

  .marcasGrid input:focus{ outline:none; border-color:var(--cyan); }

  .marcasCard button{
    background:var(--cyan);
    color:var(--bg);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
  }

  /* ---- Tarjetas del plan (mismo lenguaje visual del sitio) ---- */

  .weekHead{
    margin:34px 0 8px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }

  .dayLabel{
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--yellow);
    margin:22px 0 12px;
  }

  .cardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:12px;
  }

  .exCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:14px;
    padding:16px 18px;
  }

  .exTag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .exName{
    font-size:14.5px;
    font-weight:600;
    color:#fff;
    margin-bottom:14px;
    line-height:1.35;
  }

  .exStats{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }

  .exStats span{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:18px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }

  .exStats small{
    font-family:'Inter',sans-serif;
    font-size:9.5px;
    font-weight:600;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.5px;
  }

  .exStats .kgCalc{ color:var(--pink); }

  .pendiente{
    font-size:10px;
    color:var(--muted);
    font-style:italic;
  }

  .empty{
    color:var(--muted);
    font-size:14px;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="portal.html">Portal</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <h1>Plan</h1>
    <a href="portal.html" class="backLink">&larr; Volver al Portal</a>
  </div>

  <div class="marcasCard">
    <h2>Tus marcas</h2>
    <p class="sub">Ingresa tu máximo (PR) actual en cada movimiento. El plan calcula el peso de trabajo automáticamente según el porcentaje de cada ejercicio. Solo aparecen los movimientos que realmente usa este plan.</p>
    <div class="marcasGrid" id="marcasGrid"></div>
    <button onclick="recalcular()">Calcular pesos</button>
  </div>

  <div id="planContenedor">
    <p class="empty">Cargando plan...</p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>

  // Nombre visible y unidad de cada categoría de marca personal.
  const ETIQUETAS_MOV = {
    Arranque: "Arranque",
    Envion: "Envión",
    SentadillaTrasera: "Sentadilla trasera",
    SentadillaDelantera: "Sentadilla frontal",
  };

  let filasPlan = [];
  let movimientosUsados = [];

  function cargarMarcasGuardadas() {
    const guardado = localStorage.getItem("liftclub_marcas");
    return guardado ? JSON.parse(guardado) : {};
  }

  function guardarMarcas(marcas) {
    localStorage.setItem("liftclub_marcas", JSON.stringify(marcas));
  }

  function construirInputsMarcas() {
    const marcasGuardadas = cargarMarcasGuardadas();
    const grid = document.getElementById("marcasGrid");
    grid.innerHTML = movimientosUsados.map(mov => `
      <div>
        <label for="marca_${mov}">${ETIQUETAS_MOV[mov] || mov} (kg)</label>
        <input type="number" id="marca_${mov}" placeholder="Ej: 60" value="${marcasGuardadas[mov] || ""}">
      </div>
    `).join("");
  }

  function leerMarcasActuales() {
    const marcas = {};
    movimientosUsados.forEach(mov => {
      const val = parseFloat(document.getElementById("marca_" + mov).value);
      if (!isNaN(val) && val > 0) marcas[mov] = val;
    });
    return marcas;
  }

  function recalcular() {
    const marcas = leerMarcasActuales();
    guardarMarcas(marcas);
    renderizarPlan(marcas);
  }

  function renderizarPlan(marcas) {
    const contenedor = document.getElementById("planContenedor");

    if (filasPlan.length === 0) {
      contenedor.innerHTML = `<p class="empty">Todavía no hay un plan general cargado.</p>`;
      return;
    }

    const dias = {};
    filasPlan.forEach(f => {
      const key = f["Dia"];
      if (!dias[key]) dias[key] = [];
      dias[key].push(f);
    });

    let html = "";
    Object.keys(dias).forEach(dKey => {
      const ejercicios = dias[dKey];
      const bloque = ejercicios[0]["Bloque"];

      html += `<div class="dayLabel">${dKey} &middot; ${bloque}</div><div class="cardGrid">`;

      ejercicios.forEach(ex => {
        const series = ex["Series"] || "—";
        const reps = ex["Reps"] || "—";
        const pct = ex["Porcentaje"];
        const mov = ex["MovimientoBase"];

        let kgTexto = "—";
        let kgClase = "";
        if (pct && mov) {
          const max = marcas[mov];
          if (max) {
            kgTexto = Math.round((parseFloat(pct) / 100) * max);
            kgClase = "kgCalc";
          } else {
            kgTexto = `<span class="pendiente">ingresa tu marca</span>`;
          }
        }

        html += `
          <div class="exCard">
            <div class="exTag">${ex["Enfoque"] || ""}</div>
            <div class="exName">${ex["Ejercicio"]}</div>
            <div class="exStats">
              <span>${series}<small>series</small></span>
              <span>${reps}<small>reps</small></span>
              ${pct ? `<span>${pct}%<small>intensidad</small></span>` : ""}
              ${pct ? `<span class="${kgClase}">${kgTexto}<small>kg</small></span>` : ""}
            </div>
          </div>
        `;
      });

      html += `</div>`;
    });

    contenedor.innerHTML = html;
  }

  Papa.parse("general.csv?v=" + Date.now(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      filasPlan = results.data;

      const setMov = new Set();
      filasPlan.forEach(f => {
        if (f["MovimientoBase"]) setMov.add(f["MovimientoBase"]);
      });
      movimientosUsados = Array.from(setMov);

      construirInputsMarcas();
      renderizarPlan(cargarMarcasGuardadas());
    },
    error: function () {
      document.getElementById("planContenedor").innerHTML =
        `<p class="empty">No se pudo cargar el plan general.</p>`;
    }
  });

</script>

</body>
</html>
