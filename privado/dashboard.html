<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+SC:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  ::selection{ background:var(--pink); color:#fff; }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{
    height:26px;
    display:block;
  }

  .navLinks{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
    transition:all .15s ease;
  }

  .navLinks a:hover{
    color:#fff;
    background:var(--paper);
  }

  .navLinks a.active{
    background:var(--cyan);
    color:var(--bg);
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:60px 32px 100px;
  }

  header.pageHead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:44px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
  }

  .pageHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-size:30px;
    font-weight:400;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .pageHead .sub{
    font-size:13.5px;
    color:var(--muted);
    max-width:260px;
    text-align:right;
  }

  .formsBtn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    background:var(--pink);
    color:#fff;
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:13px 22px;
    border-radius:10px;
    margin-bottom:36px;
    transition:transform .15s ease;
  }

  .formsBtn:hover{
    transform:translateY(-2px);
  }

  .sectionHead{
    margin:60px 0 24px;
    padding-top:36px;
    border-top:1px solid var(--line);
  }

  .sectionHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .sectionHead h1{
    font-family:'Bungee', sans-serif;
    font-size:26px;
    font-weight:400;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:18px;
  }

  a.athlete{
    text-decoration:none;
    color:inherit;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:16px;
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
    transition:transform .15s ease, border-color .15s ease;
  }

  a.athlete:nth-child(3n+2){ border-left-color:var(--pink); }
  a.athlete:nth-child(3n){ border-left-color:var(--yellow); }

  a.athlete:hover{
    transform:translateY(-4px);
    border-color:var(--cyan);
  }

  .initial{
    font-family:'Bungee', sans-serif;
    font-size:26px;
    font-weight:400;
    width:52px;
    height:52px;
    border-radius:50%;
    background:#1f2124;
    color:var(--cyan);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .athlete h2{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:20px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .athlete .tag{
    font-size:11px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .athlete .go{
    margin-top:auto;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--cyan);
    display:flex;
    align-items:center;
    gap:6px;
  }

  a.athlete:hover .go svg{
    transform:translateX(4px);
  }

  .athlete .go svg{
    transition:transform .15s ease;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:30px 0 20px;
    border-top:1px solid var(--line);
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .navLinks a{ padding:8px 12px; font-size:11px; }
    .wrap{ padding:40px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="../assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="../index.html">Home</a>
    <a href="../ranking.html">Ranking</a>
    <a href="../calculadora.html">Calculadora</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </div>
</nav>

<div class="wrap">

  <header class="pageHead">
    <div>
      <div class="eyebrow">Panel de atletas</div>
      <h1>Dashboard</h1>
    </div>
    <div class="sub">Selecciona un atleta para ver su plan de entrenamiento actual.</div>
  </header>

  <a href="https://forms.cloud.microsoft/r/vgghwMeF4g" target="_blank" rel="noopener" class="formsBtn">
    Registrar mi sesión (Formulario)
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
  </a>

  <div class="grid" id="athleteGrid"></div>

  <div class="sectionHead">
    <div class="eyebrow">Monitoreo</div>
    <h1>Rendimiento y bienestar</h1>
  </div>

  <div class="grid" id="monitoreoGrid"></div>

</div>

<footer>Lift Club &middot; Actualizado por el coach</footer>

<script>

  // Lista de atletas: agrega o quita entradas aquí para actualizar el panel.
  const atletas = [
    { nombre: "Dana",     categoria: "Halterofilia", archivo: "Dana.html" },
    { nombre: "Gian",     categoria: "Halterofilia", archivo: "Gian.html" },
    { nombre: "Kevin",    categoria: "Halterofilia", archivo: "Kevin.html" },
    { nombre: "Maroto",   categoria: "Halterofilia", archivo: "Maroto.html" },
    { nombre: "Melina",   categoria: "Halterofilia", archivo: "Melina.html" },
    { nombre: "Melisson", categoria: "Halterofilia", archivo: "Melisson.html" },
    { nombre: "Sebas",    categoria: "Halterofilia", archivo: "Sebas.html" },
  ];

  const grid = document.getElementById("athleteGrid");

  // Lista de atletas con monitoreo disponible: agrega aquí conforme construyas más páginas.
  const monitoreo = [
    { nombre: "Dana", categoria: "Rendimiento y bienestar", archivo: "Dana_monitoreo.html" },
  ];

  const mGrid = document.getElementById("monitoreoGrid");
  monitoreo.forEach(a => {
    const card = document.createElement("a");
    card.className = "athlete";
    card.href = a.archivo;
    card.innerHTML = `
      <div class="initial">${a.nombre.charAt(0)}</div>
      <div>
        <div class="tag">${a.categoria}</div>
        <h2>${a.nombre}</h2>
      </div>
      <div class="go">
        Ver gráficos
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </div>
    `;
    mGrid.appendChild(card);
  });

  atletas.forEach(a => {
    const card = document.createElement("a");
    card.className = "athlete";
    card.href = a.archivo;
    card.innerHTML = `
      <div class="initial">${a.nombre.charAt(0)}</div>
      <div>
        <div class="tag">${a.categoria}</div>
        <h2>${a.nombre}</h2>
      </div>
      <div class="go">
        Ver plan
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </div>
    `;
    grid.appendChild(card);
  });

</script>

</body>
</html>
