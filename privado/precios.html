<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Planes y Precios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo.png">
<meta name="theme-color" content="#0F0F0F">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; gap:6px; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }

  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:50px 24px 100px;
  }

  .pageHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:30px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:30px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .backLink{
    font-size:13px;
    font-weight:600;
    color:var(--cyan);
    text-decoration:none;
  }

  /* ---- Aviso de pago ---- */

  .pagoAviso{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--yellow);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:30px;
  }

  .pagoAviso p{
    font-size:13px;
    color:#c9cdd1;
    margin:0;
    line-height:1.5;
  }

  /* ---- Fichas de precio ---- */

  .precioGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:16px;
    margin-bottom:16px;
  }

  .precioCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:16px;
    padding:22px;
  }

  .precioCard.seleccion{ border-left-color:var(--yellow); }
  .precioCard.complemento{ border-left-color:var(--pink); margin-bottom:24px; }

  .precioCard .etiqueta{
    font-size:11px;
    font-weight:700;
    letter-spacing:.8px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:8px;
  }

  .precioCard .precioTitulo{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:15px;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:#fff;
    margin-bottom:10px;
  }

  .precioCard .monto{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:26px;
    color:#fff;
    margin-bottom:14px;
  }

  .precioCard .monto span{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-left:4px;
  }

  .precioCard ul{
    margin:0;
    padding-left:18px;
  }

  .precioCard li{
    font-size:13px;
    color:#c9cdd1;
    line-height:1.6;
    margin-bottom:6px;
  }

  .precioCard.complemento p{
    font-size:13px;
    color:#c9cdd1;
    line-height:1.6;
    margin:0;
  }

  .precioNota{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.65;
    margin:0;
    font-style:italic;
  }

  .estado{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
    .pageHead h1{ font-size:26px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="../assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="../privado/portal.html">Portal</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <h1>Planes y cuotas</h1>
    <a href="../privado/portal.html" class="backLink">&larr; Volver al Portal</a>
  </div>

  <div class="pagoAviso">
    <p>Cuota mensual — el pago vence el día 15 de cada mes.</p>
  </div>

  <div id="precioBox">
    <p class="estado">Cargando...</p>
  </div>

</div>

<script>

  // ===================================================================
  // Mismas listas de acceso que portal.html — si alguien entra o sale
  // de Selección/JDN, actualizar aca y en portal.html (ver PLAN_CRC y
  // SELECCION_JDN alla).
  // ===================================================================

  const ADMIN = [
    "chlinton87@gmail.com",
  ];

  const PLAN_CRC = [
    "melisonaraya@gmail.com",
  ];

  // Atletas de Plan General o Kintsugi que pertenecen a Selección Nacional
  // o a un proceso de Juegos Nacionales (JDN). Quien ya está en PLAN_CRC
  // no hace falta agregarlo aca, porque Plan CRC ya implica Selección.
  const SELECCION_JDN = [
  ];

  function pintarPrecio(esAdmin, esSeleccion) {
    const fichaGeneral = `
      <div class="precioCard">
        <div class="precioTitulo">Plan General</div>
        <div class="monto">&#8353;30.000<span>/ mes</span></div>
        <ul>
          <li>Acceso completo a la plataforma</li>
          <li>Seguimiento y ajustes en tiempo real de tu entrenamiento</li>
          <li>Acompañamiento constante en la gestión de tu proceso</li>
          <li>Ejercicios básicos de preparación física incluidos (no es una periodización)</li>
        </ul>
      </div>`;

    const fichaSeleccion = `
      <div class="precioCard seleccion">
        <div class="etiqueta">Selección Nacional / Juegos Nacionales</div>
        <div class="precioTitulo">Tu cuota</div>
        <div class="monto">&#8353;20.000<span>/ mes</span></div>
        <ul>
          <li>Acceso completo a la plataforma</li>
          <li>Seguimiento y ajustes en tiempo real de tu entrenamiento</li>
          <li>Acompañamiento constante en la gestión de tu proceso</li>
          <li>Ejercicios básicos de preparación física incluidos (no es una periodización)</li>
        </ul>
      </div>`;

    const complemento = `
      <div class="precioCard complemento">
        <div class="precioTitulo">Periodización de preparación física</div>
        <div class="monto">+&#8353;20.000</div>
        <p>Tu plan de halterofilia incluye ejercicios básicos de preparación física, pero no es una periodización. Si querés un programa de preparación física planificado específicamente para vos, es un servicio aparte que se suma a tu plan.</p>
      </div>`;

    let fichas;
    if (esAdmin) {
      fichas = fichaGeneral + fichaSeleccion;
    } else if (esSeleccion) {
      fichas = fichaSeleccion;
    } else {
      fichas = fichaGeneral;
    }

    return `<div class="precioGrid">${fichas}</div>${complemento}<p class="precioNota">Un precio accesible para todo lo que representa la gestión de tu proceso: temporadas de trabajo, ajustes, seguimiento y acompañamiento constante.</p>`;
  }

  function render(identidad) {
    const correo = (identidad && identidad.email ? identidad.email : "").toLowerCase();
    const esAdmin = ADMIN.includes(correo);
    const esSeleccion = PLAN_CRC.includes(correo) || SELECCION_JDN.includes(correo);
    document.getElementById("precioBox").innerHTML = pintarPrecio(esAdmin, esSeleccion);
  }

  function renderSinIdentidad() {
    document.getElementById("precioBox").innerHTML = pintarPrecio(false, false);
  }

  fetch("/cdn-cgi/access/get-identity")
    .then(r => {
      if (!r.ok) throw new Error("sin identidad");
      return r.json();
    })
    .then(render)
    .catch(renderSinIdentidad);

</script>

</body>
</html>
