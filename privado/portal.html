<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo.png">
<meta name="theme-color" content="#0F0F0F">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  ::selection{ background:var(--pink); color:#fff; }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; display:block; }

  .navLinks{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
    transition:all .15s ease;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:56px 24px 100px;
  }

  .pageHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:.5px;
    margin:0 0 8px;
    color:#fff;
  }

  .pageHead .correo{
    font-size:13px;
    color:var(--muted);
    margin:0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:16px;
    margin-top:34px;
  }

  a.tarjeta{
    text-decoration:none;
    color:inherit;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--cyan);
    border-radius:16px;
    padding:24px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color .15s ease, transform .15s ease;
  }

  a.tarjeta.pink{ border-left-color:var(--pink); }
  a.tarjeta.yellow{ border-left-color:var(--yellow); }

  a.tarjeta:hover{ border-color:var(--cyan); transform:translateY(-3px); }
  a.tarjeta.pink:hover{ border-color:var(--pink); }
  a.tarjeta.yellow:hover{ border-color:var(--yellow); }

  .tarjeta h2{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .tarjeta p{
    font-size:13px;
    color:var(--muted);
    margin:0;
    line-height:1.55;
  }

  .tarjeta .go{
    margin-top:auto;
    padding-top:6px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--cyan);
  }

  a.tarjeta.pink .go{ color:var(--pink); }
  a.tarjeta.yellow .go{ color:var(--yellow); }

  .sectionHead{
    margin:52px 0 0;
    padding-top:32px;
    border-top:1px solid var(--line);
  }

  .sectionHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .sectionHead h2{
    font-family:'Bungee', sans-serif;
    font-size:22px;
    font-weight:400;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .estado{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }

  .salir{
    display:inline-block;
    margin-top:44px;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
  }

  .salir:hover{ color:var(--pink); border-color:var(--pink); }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
    .pageHead h1{ font-size:26px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="../assets/logo.png" alt="Lift Club 87">
  <div class="navLinks">
    <a href="../index.html">Home</a>
    <a href="../ranking.html">Ranking</a>
    <a href="../records.html">Records</a>
    <a href="../calculadora.html">Calculadora</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <div class="eyebrow">Portal</div>
    <h1 id="titulo">Cargando...</h1>
    <p class="correo" id="correo"></p>
  </div>

  <div id="contenido">
    <p class="estado">Verificando tu acceso...</p>
  </div>

</div>

<script>

  // ===================================================================
  // LISTAS DE ACCESO
  // Estas listas solo deciden QUE VE cada persona en esta pantalla.
  // La proteccion real la hace Cloudflare Access sobre cada carpeta.
  // Si agregas a alguien aca, agregalo tambien en la politica de Access.
  // Quien no este en ninguna de estas listas ve el Plan General.
  // ===================================================================

  const ADMIN = [
    "chlinton87@gmail.com",
  ];

  const PLAN_CRC = [
    "melisonaraya@gmail.com",
    "marotoignacio2@gmail.com",
    "joalmo1712@gmail.com",
  ];

  const PLAN_KINTSUGI = [
    "dana.ramkellawan@gmail.com",
    "melinamaroto01@gmail.com",
    "marotoignacio2@gmail.com",
    "joalmo1712@gmail.com",
    "giancarlocasanova80@outlook.com",
  ];

  // ---- Definicion de tarjetas ----

  const TARJETAS = {
    planGeneral: {
      href: "../plan-general/general.html",
      color: "",
      titulo: "Plan General",
      texto: "Tu programa de entrenamiento con series, repeticiones e intensidad.",
      accion: "Ver mi plan",
    },
    planCRC: {
      href: "../plan-crc/crc.html",
      color: "",
      titulo: "Plan CRC",
      texto: "Programa de la seleccion nacional.",
      accion: "Ver mi plan",
    },
    kintsugi: {
      href: "../kintsugi/kintsugi.html",
      color: "yellow",
      titulo: "Kintsugi",
      texto: "Plan de retorno progresivo, por percepcion del esfuerzo (RPE).",
      accion: "Ver mi plan",
    },
    metodologia: {
      href: "metodologia.html",
      color: "pink",
      titulo: "Metodologia",
      texto: "Los Tres Saberes y los pilares tecnicos del club.",
      accion: "Leer",
    },
    cargaIntensidad: {
      href: "carga-intensidad.html",
      color: "yellow",
      titulo: "Carga e Intensidad",
      texto: "Calcula volumen, intensidad promedio y zona de entrenamiento.",
      accion: "Abrir calculadora",
    },
    dashboard: {
      href: "../coach/dashboard.html",
      color: "pink",
      titulo: "Dashboard",
      texto: "Panel del coach: acceso a todos los planes.",
      accion: "Abrir panel",
    },
  };

  function pintarTarjetas(lista) {
    return `<div class="grid">` + lista.map(t => `
      <a href="${t.href}" class="tarjeta${t.color ? " " + t.color : ""}">
        <h2>${t.titulo}</h2>
        <p>${t.texto}</p>
        <div class="go">${t.accion} &rarr;</div>
      </a>
    `).join("") + `</div>`;
  }

  function primerNombre(nombreCompleto, correo) {
    if (nombreCompleto && nombreCompleto.trim()) {
      return nombreCompleto.trim().split(/\s+/)[0];
    }
    if (correo) return correo.split("@")[0];
    return "";
  }

  function render(identidad) {
    const correo = (identidad && identidad.email ? identidad.email : "").toLowerCase();
    const nombre = primerNombre(identidad && identidad.name, correo);

    const T = TARJETAS;
    const esAdmin = ADMIN.includes(correo);
    const esCRC = PLAN_CRC.includes(correo);
    const esKintsugi = PLAN_KINTSUGI.includes(correo);

    let tarjetas;
    if (esAdmin) {
      tarjetas = [T.dashboard, T.planGeneral, T.planCRC, T.kintsugi, T.metodologia, T.cargaIntensidad];
    } else if (esCRC && esKintsugi) {
      tarjetas = [T.planCRC, T.kintsugi, T.metodologia, T.cargaIntensidad];
    } else if (esCRC) {
      tarjetas = [T.planCRC, T.metodologia, T.cargaIntensidad];
    } else if (esKintsugi) {
      tarjetas = [T.kintsugi, T.metodologia, T.cargaIntensidad];
    } else {
      tarjetas = [T.planGeneral, T.metodologia, T.cargaIntensidad];
    }

    document.getElementById("titulo").textContent = nombre ? `Hola, ${nombre}` : "Bienvenido";
    document.getElementById("correo").textContent = correo;
    document.getElementById("contenido").innerHTML =
      pintarTarjetas(tarjetas) +
      `<a class="salir" href="/cdn-cgi/access/logout">Cerrar sesion</a>`;
  }

  // Si no logramos leer la identidad, no dejamos la pantalla vacia:
  // mostramos la vista general, que es la que le toca a la mayoria.
  function renderSinIdentidad() {
    document.getElementById("titulo").textContent = "Bienvenido";
    document.getElementById("correo").textContent = "";
    document.getElementById("contenido").innerHTML =
      pintarTarjetas([TARJETAS.planGeneral, TARJETAS.metodologia, TARJETAS.cargaIntensidad]) +
      `<a class="salir" href="/cdn-cgi/access/logout">Cerrar sesion</a>`;
  }

  fetch("/cdn-cgi/access/get-identity")
    .then(r => {
      if (!r.ok) throw new Error("sin identidad");
      return r.json();
    })
    .then(render)
    .catch(renderSinIdentidad);

</script>

</body>
</html>
