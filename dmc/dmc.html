<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - DMC</title>
<link rel="icon" href="../assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:50px 24px 100px;
  }

  .pageHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:6px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:30px;
    letter-spacing:.5px;
    margin:0;
    color:#fff;
  }

  .pageSub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 24px;
    font-style:italic;
  }

  .formBtn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    background:transparent;
    color:var(--cyan);
    border:1px solid var(--cyan);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:11px 20px;
    border-radius:10px;
    margin-bottom:30px;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), background .2s ease, box-shadow .2s ease;
  }

  .formBtn:hover{
    background:rgba(95,202,231,.1);
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(95,202,231,.25);
  }

  .formBtn:active{
    transform:translateY(0) scale(.96);
    transition-duration:.08s;
  }

  .leyenda{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-bottom:30px;
    padding:14px 18px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
  }

  .leyendaItem{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
  }

  .leyendaDot{
    width:10px;
    height:10px;
    border-radius:50%;
  }

  .leyendaDot.c1{ background:var(--cyan); }
  .leyendaDot.c2{ background:var(--pink); }
  .leyendaDot.c3{ background:var(--yellow); }

  .dayLabel{
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--yellow);
    margin:26px 0 12px;
  }

  .dayLabel:first-of-type{ margin-top:0; }

  .cardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:12px;
  }

  .claseCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--cyan);
    border-radius:14px;
    padding:16px 18px;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
  }

  .claseCard:hover{
    transform:translateY(-3px);
  }

  .claseCard.clase1{ border-left-color:var(--cyan); }
  .claseCard.clase1:hover{ box-shadow:0 6px 20px rgba(95,202,231,.2); }

  .claseCard.clase2{ border-left-color:var(--pink); }
  .claseCard.clase2:hover{ box-shadow:0 6px 20px rgba(237,29,126,.2); }

  .claseCard.clase3{ border-left-color:var(--yellow); }
  .claseCard.clase3:hover{ box-shadow:0 6px 20px rgba(253,215,0,.2); }

  .claseTag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }

  .claseHora{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:20px;
    color:#fff;
    margin-bottom:6px;
  }

  .claseEnfoque{
    font-size:13px;
    color:#c9cdd1;
    font-weight:600;
  }

  .claseNotas{
    font-size:11.5px;
    color:var(--muted);
    margin-top:8px;
    line-height:1.4;
  }

  /* ---- Selector de semana ---- */

  .semanas{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:24px;
  }

  .semanaBtn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:#c9cdd1;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 18px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }

  .semanaBtn:hover{ border-color:var(--cyan); color:#fff; }

  .semanaBtn.activa{
    background:var(--cyan);
    border-color:var(--cyan);
    color:#0F0F0F;
  }

  /* ---- Ficha que se abre con el plan ---- */

  .claseCard{ cursor:pointer; scroll-margin-top:90px; }

  .claseCard.reveal.visible:hover{ transform:translateY(-3px); }

  .claseCard:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  .claseCard.abierta{
    grid-column:1 / -1;
    cursor:default;
  }

  .claseCard.abierta:hover{ transform:none; }

  .claseCab{ cursor:pointer; }

  .verPlan{
    display:inline-block;
    margin-top:12px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--cyan);
  }

  .claseCard.clase2 .verPlan{ color:var(--pink); }
  .claseCard.clase3 .verPlan{ color:var(--yellow); }

  .flecha{
    display:inline-block;
    transition:transform .2s ease;
  }

  .claseCard.abierta .flecha{ transform:rotate(180deg); }

  .planDetalle{
    display:none;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }

  .claseCard.abierta .planDetalle{ display:block; }

  .bloqueLabel{
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--yellow);
    margin:18px 0 8px;
  }

  .bloqueLabel:first-child{ margin-top:0; }

  .ejercicio{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }

  .ejercicio:last-child{ border-bottom:none; }

  .ejNombre{
    font-size:14px;
    font-weight:600;
    color:#fff;
    line-height:1.35;
  }

  .ejNota{
    font-size:11.5px;
    color:var(--muted);
    margin-top:3px;
  }

  .ejStats{
    display:flex;
    gap:16px;
    flex-shrink:0;
  }

  .ejStats span{
    font-family:'Bungee', sans-serif;
    font-size:15px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
  }

  .ejStats small{
    font-family:'Inter',sans-serif;
    font-size:9px;
    font-weight:600;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:.5px;
  }

  .ejStats .carga{ color:var(--yellow); }

  .cerrarPlan{
    display:block;
    width:100%;
    margin-top:16px;
    padding:10px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
  }

  .cerrarPlan:hover{ color:#fff; border-color:var(--muted); }

  .pendiente{
    font-size:13px;
    color:var(--muted);
    font-style:italic;
  }

  @media (max-width:480px){
    .ejercicio{ flex-direction:column; gap:6px; }
    .ejStats span{ align-items:flex-start; }
  }

  .empty{
    color:var(--muted);
    font-size:14px;
  }

  /* ---- Scroll reveal ---- */

  .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .6s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.2,.8,.2,1);
  }

  .reveal.visible{
    opacity:1;
    transform:translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    .reveal{ opacity:1 !important; transform:none !important; }
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="../assets/logo.png" alt="Lift Club">
</nav>

<div class="wrap">

  <div class="pageHead">
    <h1>DMC</h1>
  </div>
  <p class="pageSub">Programa de halterofilia — San Roque. Uso interno de coaches.</p>

  <a href="https://forms.cloud.microsoft/pages/responsepage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAANAApTkxkRUMDBJU1Q2OUNSSk5MVk5JMk1MTkxLREJSRC4u&route=shorturl" target="_blank" rel="noopener" class="formBtn">
    Reportar clase (Formulario)
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
  </a>

  <div class="leyenda">
    <div class="leyendaItem"><span class="leyendaDot c1"></span>Clase 1</div>
    <div class="leyendaItem"><span class="leyendaDot c2"></span>Clase 2</div>
    <div class="leyendaItem"><span class="leyendaDot c3"></span>Clase 3</div>
  </div>

  <div class="semanas" id="semanas"></div>

  <div id="horarioContenedor">
    <p class="empty">Cargando horario...</p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>

  // ---- Utilidades ----

  function activarReveal() {
    const elementos = document.querySelectorAll(".reveal:not(.visible)");
    const observer = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const el = entrada.target;
          el.classList.add("visible");
          observer.unobserve(el);
          // Quitar el retraso escalonado para que el hover responda al instante.
          setTimeout(() => { el.style.transitionDelay = ""; }, 900);
        }
      });
    }, { threshold: 0.15 });
    elementos.forEach(el => observer.observe(el));
  }

  function esc(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // "Miércoles", "miercoles " y "MIERCOLES" cuentan como el mismo día.
  function normalizar(t) {
    return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
  }

  function numero(t) {
    const n = parseInt(String(t || "").replace(/\D/g, ""), 10);
    return isNaN(n) ? "" : String(n);
  }

  const ORDEN_DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const ORDEN_BLOQUES = ["calentamiento y activacion", "tecnica", "fuerza", "fisico"];

  // ---- Estado ----

  let PLAN = {};            // PLAN[semana][dia|clase] = [filas]
  let SEMANAS = ["1", "2", "3", "4"];
  let semanaActual = "1";
  let planCargado = false;

  // ---- Plan de entrenamiento ----

  function indexarPlan(filas) {
    PLAN = {};
    const semanas = new Set();
    filas.forEach(f => {
      const sem = numero(f["Semana"]);
      const dia = normalizar(f["Día"] || f["Dia"]);
      if (!sem || !dia) return;
      semanas.add(sem);
      if (!(f["Ejercicio"] || "").trim()) return;
      // Si la columna Clase queda vacía, la fila aplica a todas las clases de ese día.
      const clase = numero(f["Clase"]) || "*";
      const key = dia + "|" + clase;
      if (!PLAN[sem]) PLAN[sem] = {};
      if (!PLAN[sem][key]) PLAN[sem][key] = [];
      PLAN[sem][key].push(f);
    });
    if (semanas.size) {
      SEMANAS = [...semanas].sort((a, b) => a - b);
      if (!SEMANAS.includes(semanaActual)) semanaActual = SEMANAS[0];
    }
  }

  function ejerciciosDe(dia, clase) {
    const s = PLAN[semanaActual] || {};
    const d = normalizar(dia);
    return (s[d + "|" + clase] || []).concat(s[d + "|*"] || []);
  }

  function pintarDetalle(dia, clase) {
    if (!planCargado) {
      return `<p class="pendiente">Cargando plan...</p>`;
    }
    const filas = ejerciciosDe(dia, clase);
    if (filas.length === 0) {
      return `<p class="pendiente">Plan pendiente para la semana ${esc(semanaActual)}.</p>`;
    }

    // Agrupar por bloque, en el orden fijo del club y luego cualquier otro.
    const grupos = {};
    const orden = [];
    filas.forEach(f => {
      const nombre = (f["Bloque"] || "").trim() || "Ejercicios";
      const k = normalizar(nombre);
      if (!grupos[k]) { grupos[k] = { nombre, items: [] }; orden.push(k); }
      grupos[k].items.push(f);
    });
    orden.sort((a, b) => {
      const ia = ORDEN_BLOQUES.indexOf(a), ib = ORDEN_BLOQUES.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });

    let html = "";
    orden.forEach(k => {
      const g = grupos[k];
      html += `<div class="bloqueLabel">${esc(g.nombre)}</div>`;
      g.items.forEach(ex => {
        const series = (ex["Series"] || "").trim() || "—";
        const reps = (ex["Reps"] || "").trim() || "—";
        const carga = (ex["Carga"] || "").trim() || "—";
        const nota = (ex["Notas"] || "").trim();
        html += `
          <div class="ejercicio">
            <div>
              <div class="ejNombre">${esc(ex["Ejercicio"])}</div>
              ${nota ? `<div class="ejNota">${esc(nota)}</div>` : ""}
            </div>
            <div class="ejStats">
              <span>${esc(series)}<small>series</small></span>
              <span>${esc(reps)}<small>reps</small></span>
              <span${carga !== "—" ? ' class="carga"' : ""}>${esc(carga)}<small>carga</small></span>
            </div>
          </div>`;
      });
    });
    return html + `<button type="button" class="cerrarPlan">Cerrar plan &#9652;</button>`;
  }

  function refrescarDetalles() {
    document.querySelectorAll(".claseCard").forEach(card => {
      card.querySelector(".planDetalle").innerHTML =
        pintarDetalle(card.dataset.dia, card.dataset.clase);
    });
  }

  function pintarSemanas() {
    document.getElementById("semanas").innerHTML = SEMANAS.map(s =>
      `<button type="button" class="semanaBtn${s === semanaActual ? " activa" : ""}" data-semana="${esc(s)}">Semana ${esc(s)}</button>`
    ).join("");
  }

  document.getElementById("semanas").addEventListener("click", e => {
    const btn = e.target.closest(".semanaBtn");
    if (!btn) return;
    semanaActual = btn.dataset.semana;
    pintarSemanas();
    refrescarDetalles();
  });

  // ---- Horario ----

  // El horario sale del mismo dmc-plan.csv: cada combinación distinta de
  // Día + Clase es una ficha, con la Hora y el Enfoque de su primera fila.
  function renderizarHorario(filas) {
    const contenedor = document.getElementById("horarioContenedor");

    const dias = {};
    const vistos = new Set();
    filas.forEach(f => {
      const dia = (f["Día"] || f["Dia"] || "").trim();
      const clase = numero(f["Clase"]);
      if (!dia || !clase) return;
      const key = normalizar(dia) + "|" + clase;
      if (vistos.has(key)) return;
      vistos.add(key);
      const dKey = normalizar(dia);
      if (!dias[dKey]) dias[dKey] = { nombre: dia, clases: [] };
      dias[dKey].clases.push({ "Clase": clase, "Hora": f["Hora"] || "", "Enfoque": f["Enfoque"] || "" });
    });

    if (vistos.size === 0) {
      contenedor.innerHTML = `<p class="empty">Todavía no hay clases cargadas.</p>`;
      return;
    }

    const ordenNorm = ORDEN_DIAS.map(normalizar);
    const pos = d => { const i = ordenNorm.indexOf(d); return i === -1 ? 99 : i; };
    const diasOrdenados = Object.keys(dias).sort((a, b) => pos(a) - pos(b));
    diasOrdenados.forEach(d => dias[d].clases.sort((a, b) => a["Clase"] - b["Clase"]));

    let html = "";
    let contadorGlobal = 0;

    diasOrdenados.forEach(d => {
      const dKey = dias[d].nombre;
      html += `<div class="dayLabel reveal">${esc(dKey)}</div><div class="cardGrid">`;

      dias[d].clases.forEach(clase => {
        const numClase = numero(clase["Clase"]) || "1";
        const hora = clase["Hora"] || "";
        const enfoque = clase["Enfoque"] || "";
        const notas = (clase["Notas"] || "").trim();
        const delay = (contadorGlobal % 6) * 60;
        contadorGlobal++;

        html += `
          <div class="claseCard clase${numClase} reveal" style="transition-delay:${delay}ms"
               role="button" tabindex="0" aria-expanded="false"
               data-dia="${esc(dKey)}" data-clase="${numClase}">
            <div class="claseCab">
              <div class="claseTag">Clase ${numClase}</div>
              <div class="claseHora">${esc(hora)}</div>
              <div class="claseEnfoque">${esc(enfoque)}</div>
              ${notas ? `<div class="claseNotas">${esc(notas)}</div>` : ""}
              <div class="verPlan"><span class="txt">Ver plan</span> <span class="flecha">&#9662;</span></div>
            </div>
            <div class="planDetalle"></div>
          </div>
        `;
      });

      html += `</div>`;
    });

    contenedor.innerHTML = html;
    refrescarDetalles();
    activarReveal();
  }

  function alternar(card) {
    const abierta = card.classList.toggle("abierta");
    card.setAttribute("aria-expanded", abierta ? "true" : "false");
    card.querySelector(".verPlan .txt").textContent = abierta ? "Cerrar" : "Ver plan";
    card.scrollIntoView({ block: abierta ? "nearest" : "start", behavior: "smooth" });
  }

  const contenedorHorario = document.getElementById("horarioContenedor");

  contenedorHorario.addEventListener("click", e => {
    const card = e.target.closest(".claseCard");
    if (!card) return;
    // Con la ficha abierta, solo el encabezado la cierra
    // (así se puede leer y seleccionar el plan sin que se cierre).
    if (card.classList.contains("abierta") && !e.target.closest(".claseCab, .cerrarPlan")) return;
    alternar(card);
  });

  contenedorHorario.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest(".claseCard");
    if (!card || e.target !== card) return;
    e.preventDefault();
    alternar(card);
  });

  // ---- Carga de datos ----

  pintarSemanas();

  const opcionesCSV = {
    download: true,
    header: true,
    skipEmptyLines: true,
    transformHeader: h => h.replace(/^﻿/, "").trim(),
  };

  // Todo sale de un solo archivo: dmc-plan.csv (horario + ejercicios).
  Papa.parse("dmc-plan.csv?v=" + Date.now(), Object.assign({}, opcionesCSV, {
    complete: function (results) {
      indexarPlan(results.data);
      planCargado = true;
      pintarSemanas();
      renderizarHorario(results.data);
    },
    error: function () {
      document.getElementById("horarioContenedor").innerHTML =
        `<p class="empty">No se pudo cargar el plan (dmc-plan.csv).</p>`;
    }
  }));

</script>

</body>
</html>
