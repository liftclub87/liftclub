<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Club - Records Nacionales</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#0F0F0F;
    --cyan:#5FCAE7;
    --pink:#ED1D7E;
    --yellow:#FDD700;
    --paper:#17181A;
    --line:#26282B;
    --muted:#8b9096;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#EDEFF1;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(15,15,15,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }

  nav img.logo{ height:26px; }

  .navLinks{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  .navLinks a{
    color:#c9cdd1;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
  }

  .navLinks a:hover{ color:#fff; background:var(--paper); }
  .navLinks a.active{ background:var(--cyan); color:var(--bg); }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:50px 24px 100px;
  }

  .pageHead .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:10px;
  }

  .pageHead h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:.5px;
    margin:0 0 10px;
    color:#fff;
  }

  .pageHead p{
    color:var(--muted);
    font-size:14px;
    max-width:520px;
    margin:0 0 28px;
    line-height:1.5;
  }

  .filtros{
    display:flex;
    gap:12px;
    margin-bottom:24px;
    flex-wrap:wrap;
    align-items:center;
  }

  select{
    background:var(--paper);
    border:1px solid var(--line);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:12px 16px;
    border-radius:10px;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238b9096' stroke-width='2'><path d='M2 4l5 5 5-5'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }

  select:focus{ outline:none; border-color:var(--cyan); }

  .toggle{
    display:inline-flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }

  .toggle button{
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
  }

  .toggle button.active{
    background:var(--cyan);
    color:var(--bg);
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }

  thead th{
    text-align:left;
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }

  tbody td{
    padding:12px 14px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }

  tbody tr:last-child td{ border-bottom:none; }

  td.cat{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    color:var(--yellow);
    font-size:14px;
    white-space:nowrap;
  }

  .marca{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    color:#fff;
    font-size:15px;
  }

  .holder{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:400;
    margin-top:2px;
  }

  td.arranque .marca{ color:var(--cyan); }
  td.envion .marca{ color:var(--pink); }
  td.total .marca{ color:var(--yellow); }

  .sinmarca{ color:var(--muted); font-size:13px; }

  .empty{
    color:var(--muted);
    font-size:14px;
    padding:20px;
    text-align:center;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:40px 0 20px;
  }

  @media (max-width:640px){
    nav{ padding:16px 20px; }
    .wrap{ padding:36px 20px 60px; }
    .holder{ display:none; }
  }

</style>
</head>

<body>

<nav>
  <img class="logo" src="assets/logo.png" alt="Lift Club">
  <div class="navLinks">
    <a href="index.html">Home</a>
    <a href="ranking.html">Ranking</a>
    <a href="records.html" class="active">Records</a>
    <a href="calculadora.html">Calculadora</a>
    <a href="recursos.html">Recursos</a>
    <a href="portal.html">Ingresar</a>
  </div>
</nav>

<div class="wrap">

  <div class="pageHead">
    <div class="eyebrow">Halterofilia Costa Rica</div>
    <h1>Records Nacionales</h1>
    <p>Marcas máximas registradas por categoría de edad, género y peso corporal.</p>
  </div>

  <div class="filtros">
    <select id="filtroEdad">
      <option value="Senior">Senior</option>
      <option value="Junior">Junior</option>
      <option value="Youth">Youth</option>
    </select>
    <div class="toggle">
      <button id="btnM" class="active">Masculino</button>
      <button id="btnF">Femenino</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Cat.</th>
        <th>Arranque</th>
        <th>Envión</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="recordsBody"></tbody>
  </table>

</div>

<footer>Lift Club &middot; Records actualizados por categoría, sujetos a ratificación oficial</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>

  let datosCompletos = [];
  let edadActiva = "Senior";
  let generoActivo = "M";

  const ordenCat = ["49","53","55","57","60","61","65","69","70","75","77","85","86","95","110",
                     ">86",">77",">95",">110"];

  function celda(fila, clase) {
    if (!fila || !fila["Marca"] || parseFloat(fila["Marca"]) === 0) {
      return `<td class="${clase}"><span class="sinmarca">Sin marca</span></td>`;
    }
    const nombre = fila["Nombre"] ? `<span class="holder">${fila["Nombre"]}</span>` : "";
    return `<td class="${clase}"><span class="marca">${fila["Marca"]} kg</span>${nombre}</td>`;
  }

  function dibujarTabla() {
    const filtrado = datosCompletos.filter(r => r["AgeGroup"] === edadActiva && r["Genero"] === generoActivo);

    const categorias = {};
    filtrado.forEach(r => {
      const cat = r["PesoCat"];
      if (!categorias[cat]) categorias[cat] = {};
      categorias[cat][r["Movimiento"]] = r;
    });

    const catsOrdenadas = Object.keys(categorias).sort((a, b) => {
      const ai = ordenCat.indexOf(a), bi = ordenCat.indexOf(b);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });

    const tbody = document.getElementById("recordsBody");

    if (catsOrdenadas.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty">No hay datos disponibles.</td></tr>`;
      return;
    }

    tbody.innerHTML = catsOrdenadas.map(cat => {
      const g = categorias[cat];
      return `
        <tr>
          <td class="cat">${cat} kg</td>
          ${celda(g["Arranque"], "arranque")}
          ${celda(g["Envion"], "envion")}
          ${celda(g["Total"], "total")}
        </tr>
      `;
    }).join("");
  }

  Papa.parse("records.csv?v=" + Date.now(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      datosCompletos = results.data;
      dibujarTabla();
    },
    error: function () {
      document.getElementById("recordsBody").innerHTML =
        `<tr><td colspan="4" class="empty">No se pudieron cargar los records.</td></tr>`;
    }
  });

  document.getElementById("filtroEdad").addEventListener("change", function () {
    edadActiva = this.value;
    dibujarTabla();
  });

  document.getElementById("btnM").addEventListener("click", function () {
    generoActivo = "M";
    this.classList.add("active");
    document.getElementById("btnF").classList.remove("active");
    dibujarTabla();
  });

  document.getElementById("btnF").addEventListener("click", function () {
    generoActivo = "F";
    this.classList.add("active");
    document.getElementById("btnM").classList.remove("active");
    dibujarTabla();
  });

</script>

</body>
</html>
